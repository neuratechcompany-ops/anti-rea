name: Bug report
description: Report a reproducible defect in Anti-REA
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Do not include real secrets or private artifacts.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, target platform and relevant tool versions.
  - type: checkboxes
    id: security
    attributes:
      label: Security confirmation
      options:
        - label: This is not an undisclosed security vulnerability.
          required: true
